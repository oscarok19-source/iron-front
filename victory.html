        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@700&display=swap');
        * { image-rendering: pixelated; image-rendering: crisp-edges; }
        .ps2p { font-family: 'Press Start 2P', monospace; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        @keyframes bgZoom {
          0% { transform: scale(1.12); }
          100% { transform: scale(1); }
        }
        @keyframes glitch {
          0%, 90%, 100% { transform: translate(0,0); text-shadow: 3px 0 #00FFD1, -3px 0 #FF0033; }
          91% { transform: translate(-2px,1px); text-shadow: 5px 0 #00FFD1, -5px 0 #FF0033; }
          92% { transform: translate(2px,-1px); text-shadow: -4px 0 #FFE600, 4px 0 #00FFD1; }
          93% { transform: translate(-1px,0); text-shadow: 3px 0 #FF0033, -3px 0 #00FFD1; }
          94% { transform: translate(1px,1px); }
        }
        @keyframes blinkSoft { 0%,100% { opacity:1 } 50% { opacity:0.55 } }
        @keyframes heroBob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
        @keyframes heroEnter { 
          0% { transform: translateY(-86px) scale(0.88); opacity:0 } 
          55% { transform: translateY(16px) scale(1.06); opacity:1 } 
          75% { transform: translateY(-10px) scale(0.98) } 
          100% { transform: translateY(0) scale(1); opacity:1 } 
        }
        @keyframes victoryJump {
          0%, 18%, 38%, 100% { transform: translateY(0) }
          60% { transform: translateY(-26px) }
          68% { transform: translateY(-26px) }
          84% { transform: translateY(8px) }
        }
        @keyframes victoryFrames {
          0% { background-position: 0% 0% }
          20% { background-position: 25% 0% }
          40% { background-position: 50% 0% }
          60% { background-position: 75% 0% }
          80% { background-position: 100% 0% }
          100% { background-position: 100% 0% }
        }
        @keyframes shake {
          0%,100% { transform: translate(0,0) rotate(-1deg) }
          20% { transform: translate(-1px,1px) rotate(-1.2deg) }
          40% { transform: translate(1px,-1px) rotate(-0.8deg) }
          60% { transform: translate(-1px,0) rotate(-1deg) }
          80% { transform: translate(1px,1px) rotate(-1.1deg) }
        }
        @keyframes lightRed { 0%,100% { opacity:0.18 } 50% { opacity:0.45 } }
        @keyframes lightCyan { 0%,100% { opacity:0.12 } 50% { opacity:0.32 } }
        @keyframes scanMove { 0% { transform: translateX(-100%) } 100% { transform: translateX(200%) } }
        @keyframes floorPulse { 0%,100% { opacity:0.25 } 50% { opacity:0.6 } }
        @keyframes equalizer { 0%,100% { height: 30% } 50% { height: 95% } }
        @keyframes corePulse { 0%,100% { opacity:1; filter: brightness(1.3) drop-shadow(0 0 12px #FF0033) } 50% { opacity:0.4; filter: brightness(0.6) } }

<script>(function(){
var ASSETS={p1:{0:null,1:'assets/heavy_player1_victory_EXACT_1080x290.png'},p2:{0:'assets/victory_souldier_player2_1080x290_rgb.png',1:'assets/victory_heavy_player2.png'}};
function resolveSkins(){
  try{
    var raw=sessionStorage.getItem('ironFront:stats');
    if(raw){
      var d=JSON.parse(raw);
      if(d.isCoop){return {coop:true,p1:(d.p1Char||0),p2:(d.p2Char||0)};}
      return {coop:false};
    }
  }catch(e){}
  try{
    var c=sessionStorage.getItem('coopState')||sessionStorage.getItem('coopActive');
    if(c){
      var s=JSON.parse(c);
      if(s&&(s.isCoop||s.myPlayer)){
        var p1=s.myPlayer===1?(s.myChar||0):(s.remoteChar||0);
        var p2=s.myPlayer===2?(s.myChar||0):(s.remoteChar||0);
        return {coop:true,p1:p1,p2:p2};
      }
    }
  }catch(e2){}
  return {coop:false};
}
function findArt(root){
  var divs=root.querySelectorAll('div');
  for(var i=0;i<divs.length;i++){
    var el=divs[i];
    if(el.style&&(el.style.width==='260px'||el.style.width==='200px')&&el.style.backgroundImage&&el.style.backgroundImage.indexOf('url(')!==-1&&el.style.backgroundSize&&el.style.backgroundSize.indexOf('500%')!==-1){return el;}
  }
  return null;
}
function pathTo(root,el){
  var path=[];
  var n=el;
  while(n&&n!==root){
    var parent=n.parentNode;
    if(!parent){return null;}
    var idx=Array.prototype.indexOf.call(parent.childNodes,n);
    if(idx===-1){return null;}
    path.unshift(idx);
    n=parent;
  }
  if(n!==root){return null;}
  return path;
}
function nodeAtPath(root,path){
  var n=root;
  for(var i=0;i<path.length;i++){
    if(!n||!n.childNodes){return null;}
    n=n.childNodes[path[i]];
  }
  return n||null;
}
function findSlot(labelEl){
  var n=labelEl;
  while(n&&n!==document.body){
    if(findArt(n)){return n;}
    n=n.parentNode;
  }
  return null;
}
function setSkin(art,src,tag){
  if(!art||!src){dbg(tag+':skip');return;}
  try{
    var im=new Image();
    im.onload=function(){
      art.style.backgroundImage='url("'+src+'")';
      art.style.width='200px';
      art.style.height='269px';
      dbg(tag+':OK '+im.width+'x'+im.height);
    };
    im.onerror=function(){dbg(tag+':ERROR no carga '+src);try{console.error('[IronFront victory] No se pudo cargar la imagen de '+tag+': '+src+' (revisa que el archivo exista en esa ruta exacta, mismas mayusculas/minusculas)');}catch(e){}};
    im.src=src;
    dbg(tag+':loading '+src);
  }catch(e){dbg(tag+':EX '+e);}
}
function dbg(m){try{console.log('[IronFront victory]',m);}catch(e){}}
var T0=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
function nowMs(){return (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();}
function settled(){
  if(nowMs()-T0<2300){return false;}
  try{
    var h=document.querySelector('h1');
    if(h&&h.textContent&&h.textContent.indexOf('¡VICTORIA!')===-1){return false;}
  }catch(e){}
  return true;
}
function normalizeVisible(root){
  var all=root.querySelectorAll('*');
  var list=[root];
  for(var i=0;i<all.length;i++){list.push(all[i]);}
  for(var k=0;k<list.length;k++){
    var el=list[k];
    var c=el.className;
    if(typeof c!=='string'||!c){continue;}
    var parts=c.split(/\s+/);
    var out=[];
    for(var p=0;p<parts.length;p++){
      var t=parts[p];
      if(t==='opacity-0'||t==='-translate-x-16'||t==='translate-x-16'||t==='translate-y-6'||t==='scale-x-0'){continue;}
      out.push(t);
    }
    el.className=out.join(' ');
  }
  if((' '+root.className+' ').indexOf(' opacity-100 ') === -1){root.className=(root.className+' opacity-100').replace(/^\s+/,'');}
  if((' '+root.className+' ').indexOf(' translate-x-0 ') === -1){root.className=(root.className+' translate-x-0').replace(/^\s+/,'');}
}
var observing=false;
function startObserver(parent){
  if(observing||typeof MutationObserver==='undefined'||!parent){return;}
  observing=true;
  var busy=false;
  var mo=new MutationObserver(function(){
    if(busy){return;}
    try{
      if(!document.querySelector('[data-hero2]')){
        busy=true;
        try{apply();}catch(e){}
        busy=false;
      }
    }catch(e2){}
  });
  try{mo.observe(parent,{childList:true});}catch(e3){}
}
function apply(){
  if(document.querySelector('[data-hero2]')){return true;}
  var sk=resolveSkins();
  if(!sk.coop){return true;}
  if(!settled()){return false;}
  var all=document.querySelectorAll('div');
  var label=null;
  for(var i=0;i<all.length;i++){
    if(all[i].textContent==='HERO-01 // VICTORY'){label=all[i];break;}
  }
  if(!label){return false;}
  var slot=findSlot(label);
  if(!slot){return false;}
  var art=findArt(slot);
  if(!art){return false;}
  var artPath=pathTo(slot,art);
  var src1=ASSETS.p1[sk.p1]||null;
  var src2=ASSETS.p2[sk.p2]||null;
  dbg('skins p1='+sk.p1+' p2='+sk.p2);
  var clone=slot.cloneNode(true);
  clone.setAttribute('data-hero2','1');
  normalizeVisible(clone);
  var labels=clone.querySelectorAll('div');
  for(var j=0;j<labels.length;j++){
    if(labels[j].textContent==='HERO-01 // VICTORY'){labels[j].textContent='HERO-02 // VICTORY';break;}
  }
  slot.parentNode.insertBefore(clone,slot.nextSibling);
  dbg('slot2 insertado');
  if(src1){setSkin(art,src1,'P1');}
  var art2=artPath?nodeAtPath(clone,artPath):null;
  dbg('art2 por posicion '+(art2?'encontrado':'NO encontrado'));
  if(!art2){art2=findArt(clone);dbg('art2 por estilo (respaldo) '+(art2?'encontrado':'NO encontrado'));}
  if(art2&&src2){setSkin(art2,src2,'P2');}
  startObserver(slot.parentNode);
  return true;
}
var tries=0;
var iv=setInterval(function(){try{if(apply()||tries++>150){clearInterval(iv);}}catch(e){clearInterval(iv);}},100);
})();</script>
